<head>

<title>Huisbeheer — unit tests</title>
<link rel="stylesheet" href="style.css">
<style>
  /* The harness borrows the app's tokens so a broken theme shows up here too. */
  body { display: block; padding: 24px; }
  .t-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .t-summary { font-family: var(--font-mono); font-size: 15px; padding: 8px 14px; border-radius: var(--radius-sm); }
  .t-summary.ok { background: var(--accent-soft); color: var(--accent); }
  .t-summary.bad { background: var(--danger-soft); color: var(--danger); }
  .t-group { margin: 20px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em;
             text-transform: uppercase; color: var(--text-tertiary); }
  .t-row { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: start;
           padding: 5px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .t-tag { font-family: var(--font-mono); font-weight: 700; font-size: 11px; padding: 2px 0; }
  .t-row.pass .t-tag { color: var(--success); }
  .t-row.fail { background: var(--danger-soft); }
  .t-row.fail .t-tag { color: var(--danger); }
  .t-detail { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
              white-space: pre-wrap; word-break: break-word; margin-top: 3px; }
</style>
</head>
<body>

<div class="t-head">
  <h1>Unit tests</h1>
  <span class="t-summary" id="summary">running…</span>
</div>
<div id="results"></div>

<script type="module">

} from "./db.js";

// ═══════════════════════════════════════════════════════════════════════════
// Harness — no framework, no runner, no npm (BLUEPRINT §12)
// ═══════════════════════════════════════════════════════════════════════════

const out = document.getElementById("results");
let passed = 0;
let failed = 0;

function group(name) {
  const el = document.createElement("div");
  el.className = "t-group";
  el.textContent = name;
  out.append(el);
}

function record(ok, label, detail) {
  ok ? passed++ : failed++;
  const row = document.createElement("div");
  row.className = `t-row ${ok ? "pass" : "fail"}`;
  const tag = document.createElement("span");
  tag.className = "t-tag";
  tag.textContent = ok ? "PASS" : "FAIL";
  const body = document.createElement("div");
  body.textContent = label;
  if (!ok && detail) {
    const d = document.createElement("div");
    d.className = "t-detail";
    d.textContent = detail;
    body.append(d);
  }
  row.append(tag, body);
  out.append(row);
}

function assertEqual(actual, expected, label) {
  const ok = Object.is(actual, expected);
  record(ok, label, ok ? "" : `expected: ${JSON.stringify(expected)}\nactual:   ${JSON.stringify(actual)}`);
}

function assertDeepEqual(actual, expected, label) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  record(a === b, label, a === b ? "" : `expected: ${b}\nactual:   ${a}`);
}

function assertTrue(value, label, detail) {
  record(!!value, label, value ? "" : detail || "expected a truthy value");
}

async function assertRejects(promise, label) {
  try {
    await promise;
    record(false, label, "expected a rejection, but it resolved");
  } catch {
    record(true, label);
  }
}

/** A deterministic record. Only what a test cares about is ever passed in. */
function fx(over = {}) {
  return makeRecord({
    id: over.id || `id-${Math.random().toString(36).slice(2, 10)}`,
    createdAt: "2026-01-01T00:00:00.000Z",
    updatedAt: "2026-01-01T00:00:00.000Z",
    ...over,
  });
}

const ids = (r) => (r.results || r).map((i) => i.id);

// ═══════════════════════════════════════════════════════════════════════════
async function main() {

// ═══════════════════════════════════════════════════════════════════════════
// ui.js — escaping
// ═══════════════════════════════════════════════════════════════════════════
group("ui.js · escapeHtml");

assertEqual(escapeHtml("plain"), "plain", "leaves plain text alone");
assertEqual(escapeHtml("<b>x</b>"), "&lt;b&gt;x&lt;/b&gt;", "escapes angle brackets");
assertEqual(escapeHtml('a "b" c'), "a &quot;b&quot; c", "escapes double quotes (attribute break-out)");
assertEqual(escapeHtml("it's"), "it&#39;s", "escapes single quotes");
assertEqual(escapeHtml("a & b"), "a &amp; b", "escapes ampersand");
assertEqual(escapeHtml("&lt;"), "&amp;lt;", "escapes the ampersand first, not twice");
assertEqual(escapeHtml(null), "", "null becomes an empty string");
assertEqual(escapeHtml(undefined), "", "undefined becomes an empty string");
assertEqual(escapeHtml(0), "0", "zero survives (not treated as absent)");
assertEqual(
  escapeHtml('<img src=x onerror="alert(1)">'),
  "&lt;img src=x onerror=&quot;alert(1)&quot;&gt;",
  "neutralises an onerror payload"
);

// ═══════════════════════════════════════════════════════════════════════════
// ui.js — date helpers
// ═══════════════════════════════════════════════════════════════════════════
group("ui.js · daysUntil / todayIso");

assertEqual(daysUntil("2026-08-04", "2026-08-04"), 0, "same day is 0");
assertEqual(daysUntil("2026-08-11", "2026-08-04"), 7, "a week ahead is 7");
assertEqual(daysUntil("2026-08-01", "2026-08-04"), -3, "overdue is negative");
assertEqual(daysUntil("2027-01-01", "2026-12-31"), 1, "crosses a year boundary");
assertEqual(daysUntil("2026-03-02", "2026-02-28"), 2, "crosses end of February");
assertEqual(daysUntil("2028-03-01", "2028-02-28"), 2, "handles a leap day in between");
assertEqual(daysUntil("2026-10-26", "2026-10-24"), 2, "unaffected by the DST changeover");
assertEqual(daysUntil("2026-08-04T23:59:00Z", "2026-08-04T00:01:00Z"), 0,
  "date-only comparison: a timestamp does not flip the day");
assertEqual(daysUntil("", "2026-08-04"), null, "missing date returns null");
assertEqual(daysUntil("2026-08-04", ""), null, "missing today returns null");
assertEqual(daysUntil("not-a-date", "2026-08-04"), null, "malformed date returns null");

assertEqual(todayIso(new Date(2026, 7, 4, 12, 0, 0)), "2026-08-04", "formats local date");
assertEqual(todayIso(new Date(2026, 0, 9, 12, 0, 0)), "2026-01-09", "zero-pads month and day");
assertEqual(
  todayIso(new Date(2026, 11, 31, 23, 30, 0)),
  "2026-12-31",
  "late local evening stays on the local date, not tomorrow in UTC"
);

group("ui.js · formatDate / formatDateTime");

assertEqual(formatDate(""), "", "empty input gives an empty string");
assertEqual(formatDate(null), "", "null gives an empty string");
assertEqual(formatDate("nonsense"), "", "unparseable input gives an empty string");
assertTrue(formatDate("2026-08-04T10:00:00Z", "nl").includes("2026"), "nl date contains the year");
assertTrue(formatDate("2026-08-04T10:00:00Z", "en").includes("2026"), "en date contains the year");
assertTrue(
  formatDate("2026-08-04T10:00:00Z", "nl") !== formatDate("2026-08-04T10:00:00Z", "en"),
  "nl and en render differently"
);
assertEqual(formatDateTime(""), "", "empty datetime gives an empty string");
assertEqual(formatDateTime("nonsense"), "", "unparseable datetime gives an empty string");
assertTrue(/\d{2}:\d{2}/.test(formatDateTime("2026-08-04T10:07:00Z", "nl")), "datetime includes a clock time");
assertTrue(
  formatDate("2026-08-04T10:00:00Z", "zz") === formatDate("2026-08-04T10:00:00Z", "nl"),
  "unknown language falls back to nl"
);

group("ui.js · formatBytes");

assertEqual(formatBytes(0), "0 B", "zero bytes");
assertEqual(formatBytes(512), "512 B", "under 1 kB stays in bytes");
assertEqual(formatBytes(1024), "1 kB", "exactly 1 kB");
assertEqual(formatBytes(1024 * 1024), "1 MB", "exactly 1 MB");
assertEqual(formatBytes(1024 * 1024 * 1024), "1 GB", "exactly 1 GB");
assertEqual(formatBytes(1024 ** 4), "1 TB", "exactly 1 TB");
assertTrue(formatBytes(1024 ** 5).endsWith(" TB"), "stops climbing at TB, the largest unit");
assertTrue(formatBytes(1536).endsWith(" kB"), "1536 bytes reports in kB");
assertTrue(formatBytes(150 * 1024 * 1024).startsWith("150"), "large values round to a whole number");
assertEqual(formatBytes(-1), "", "negative input gives an empty string");
assertEqual(formatBytes(NaN), "", "NaN gives an empty string");
assertEqual(formatBytes(Infinity), "", "Infinity gives an empty string");

group("ui.js · previewKind (how a file is shown in the in-app viewer)");

assertEqual(previewKind("application/pdf"), "pdf", "a PDF is framed");
assertEqual(previewKind("image/jpeg"), "image", "a jpeg is an image");
assertEqual(previewKind("image/png"), "image", "any image/* is an image");
assertEqual(previewKind("image/svg+xml"), "image", "svg is shown via <img>, which cannot run its script");
assertEqual(previewKind("text/plain"), "text", "plain text is shown as text");
assertEqual(previewKind("text/csv"), "text", "csv is shown as text");
assertEqual(previewKind("application/json"), "text", "json is shown as text");
assertEqual(previewKind("application/xml"), "text", "xml is shown as text");
assertEqual(previewKind("APPLICATION/PDF"), "pdf", "the check is case-insensitive");
assertEqual(previewKind("text/plain; charset=utf-8"), "text", "a charset parameter is ignored");
assertEqual(
  previewKind("text/html"),
  "text",
  "html is shown as SOURCE, never framed — a blob: URL inherits our origin, " +
    "so framing it would run the file's scripts against our own IndexedDB"
);
assertEqual(previewKind("application/xhtml+xml"), "text", "xhtml is shown as source too");
assertEqual(
  previewKind("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"),
  "none",
  "a spreadsheet cannot be shown and must be downloaded"
);
assertEqual(previewKind("application/zip"), "none", "an archive cannot be shown");
assertEqual(previewKind("application/msword"), "none", "a Word document cannot be shown");
assertEqual(previewKind(""), "none", "an unknown type cannot be shown");
assertEqual(previewKind(null), "none", "a missing type cannot be shown");

assertEqual(isPreviewable("application/pdf"), true, "isPreviewable agrees for a PDF");
assertEqual(isPreviewable("application/zip"), false, "isPreviewable agrees for an archive");
assertEqual(isPreviewable("text/html"), true, "html is previewable — as source");

group("ui.js · replaceExtension");

assertEqual(replaceExtension("photo.png", "jpg"), "photo.jpg", "swaps the extension");
assertEqual(replaceExtension("photo.PNG", "jpg"), "photo.jpg", "swaps an upper-case extension");
assertEqual(
  replaceExtension("Contract 2026.v2.png", "jpg"),
  "Contract 2026.v2.jpg",
  "only the LAST dot is the extension"
);
assertEqual(replaceExtension("noextension", "jpg"), "noextension.jpg", "appends when there is none");
assertEqual(replaceExtension(".hidden", "jpg"), ".hidden.jpg", "a leading dot is not an extension");
assertEqual(replaceExtension("", "jpg"), "bestand.jpg", "an empty name still gets a usable filename");
assertEqual(replaceExtension(null, "jpg"), "bestand.jpg", "a null name still gets a usable filename");

group("ui.js · reminderTone / reminderLabel");

assertEqual(reminderTone(-1), "overdue", "yesterday is overdue");
assertEqual(reminderTone(-100), "overdue", "long past is overdue");
assertEqual(reminderTone(0), "today", "zero days is today");
assertEqual(reminderTone(1), "soon", "tomorrow is soon");
assertEqual(reminderTone(7), "soon", "exactly a week away is still soon");
assertEqual(reminderTone(8), "later", "eight days away is later");
assertEqual(reminderTone(null), "none", "no reminder has no tone");
assertEqual(reminderTone(undefined), "none", "undefined has no tone");
assertEqual(reminderLabel(null), "", "no reminder has no label");
{
  const before = state.lang;
  setLang("en");
  assertEqual(reminderLabel(0), "Today", "today reads as Today");
  assertEqual(reminderLabel(-1), "1 day overdue", "singular overdue has its own form");
  assertEqual(reminderLabel(-3), "3 days overdue", "plural overdue interpolates the count");
  assertEqual(reminderLabel(1), "In 1 day", "singular future has its own form");
  assertEqual(reminderLabel(5), "In 5 days", "plural future interpolates the count");
  setLang("nl");
  assertEqual(reminderLabel(0), "Vandaag", "the label follows the language");
  setLang(before);
}

// ═══════════════════════════════════════════════════════════════════════════
// markdown.js — PURE, and the XSS surface (§12)
// ═══════════════════════════════════════════════════════════════════════════
group("markdown.js · safeUrl");

assertEqual(safeUrl("https://example.com"), "https://example.com", "https is allowed");
assertEqual(safeUrl("http://example.com"), "http://example.com", "http is allowed");
assertEqual(safeUrl("mailto:a@b.com"), "mailto:a@b.com", "mailto is allowed");
assertEqual(safeUrl("tel:+3212345"), "tel:+3212345", "tel is allowed");
assertEqual(safeUrl("www.example.com"), "https://www.example.com", "a bare www gets https");
assertEqual(safeUrl("#anchor"), "#anchor", "a fragment is allowed");
assertEqual(safeUrl("/local/path"), "/local/path", "a relative path is allowed");
assertEqual(safeUrl("javascript:alert(1)"), null, "javascript: is refused");
assertEqual(safeUrl("JaVaScRiPt:alert(1)"), null, "javascript: is refused whatever the case");
assertEqual(safeUrl("java\tscript:alert(1)"), null, "a tab inside the scheme does not smuggle it through");
assertEqual(safeUrl("java\nscript:alert(1)"), null, "a newline inside the scheme does not either");
assertEqual(safeUrl(" javascript:alert(1)"), null, "leading whitespace does not either");
assertEqual(safeUrl("data:text/html,<script>"), null, "data: is refused");
assertEqual(safeUrl("vbscript:msgbox"), null, "vbscript: is refused");
assertEqual(safeUrl("file:///etc/passwd"), null, "file: is refused");
assertEqual(safeUrl("ftp://example.com"), null, "an unknown scheme is refused");
assertEqual(safeUrl(""), null, "empty is refused");
assertEqual(safeUrl(null), null, "null is refused");

group("markdown.js · renderMarkdown — XSS");

assertEqual(
  renderMarkdown("<script>alert(1)<\/script>"),
  "<p>&lt;script&gt;alert(1)&lt;/script&gt;</p>",
  "a script tag is escaped, never emitted"
);
assertTrue(
  !renderMarkdown('<img src=x onerror="alert(1)">').includes("<img"),
  "an img/onerror payload cannot become a tag"
);
assertTrue(
  !renderMarkdown("[click](javascript:alert(1))").includes("<a "),
  "a javascript: link never becomes an anchor"
);
assertTrue(
  renderMarkdown("[click](javascript:alert(1))").includes("[click]"),
  "…it is left as visible plain text instead"
);
assertTrue(
  !renderMarkdown("[x](data:text/html;base64,PHNjcmlwdD4=)").includes("<a "),
  "a data: link never becomes an anchor"
);
{
  // Attribute break-out: the quote is already &quot; before it reaches href.
  const html = renderMarkdown('[x](https://a.example" onmouseover="alert(1))');
  assertTrue(!html.includes('onmouseover="alert'), "a quote in a URL cannot break out of href");
  assertTrue(!/href="[^"]*"\s+on/i.test(html), "no event handler attribute is ever produced");
}
assertTrue(
  !renderMarkdown("`<script>alert(1)<\/script>`").includes("<script>"),
  "html inside a code span is escaped too"
);
assertTrue(
  !renderMarkdown("```\n<script>alert(1)<\/script>\n```").includes("<script>alert"),
  "html inside a fenced block is escaped too"
);
assertTrue(
  !renderMarkdown("# <img src=x onerror=alert(1)>").includes("<img"),
  "a heading does not smuggle html through"
);
assertTrue(
  !renderMarkdown("> <script>alert(1)<\/script>").includes("<script>alert"),
  "a blockquote does not smuggle html through"
);
assertTrue(
  !renderMarkdown("- <script>alert(1)<\/script>").includes("<script>alert"),
  "a list item does not smuggle html through"
);
assertTrue(
  renderMarkdown("a & b < c").includes("&amp;") && renderMarkdown("a & b < c").includes("&lt;"),
  "ampersands and angle brackets are escaped in plain text"
);

group("markdown.js · renderMarkdown — formatting");

assertEqual(renderMarkdown(""), "", "empty source renders nothing");
assertEqual(renderMarkdown(null), "", "null source renders nothing");
assertEqual(renderMarkdown("   \n  \n"), "", "whitespace only renders nothing");
assertEqual(renderMarkdown("Hello"), "<p>Hello</p>", "a bare line is a paragraph");
assertEqual(renderMarkdown("# Title"), "<h1>Title</h1>", "one hash is h1");
assertEqual(renderMarkdown("### Sub"), "<h3>Sub</h3>", "three hashes is h3");
assertEqual(renderMarkdown("#NoSpace"), "<p>#NoSpace</p>", "a hash without a space is not a heading");
assertEqual(renderMarkdown("**bold**"), "<p><strong>bold</strong></p>", "double star is strong");
assertEqual(renderMarkdown("*italic*"), "<p><em>italic</em></p>", "single star is em");
assertEqual(renderMarkdown("~~gone~~"), "<p><del>gone</del></p>", "double tilde is del");
assertEqual(renderMarkdown("`code`"), "<p><code>code</code></p>", "backticks are code");
assertEqual(
  renderMarkdown("`**not bold**`"),
  "<p><code>**not bold**</code></p>",
  "emphasis inside a code span is left alone"
);
assertEqual(renderMarkdown("---"), "<hr>", "three dashes is a rule");
assertEqual(
  renderMarkdown("- one\n- two"),
  "<ul><li>one</li><li>two</li></ul>",
  "dashes make an unordered list"
);
assertEqual(
  renderMarkdown("1. one\n2. two"),
  "<ol><li>one</li><li>two</li></ol>",
  "numbers make an ordered list"
);
assertEqual(renderMarkdown("> quoted"), "<blockquote>quoted</blockquote>", "a chevron is a blockquote");
assertEqual(
  renderMarkdown("&gt; quoted"),
  "<p>&amp;gt; quoted</p>",
  "a literal &gt; typed by the user stays literal and does NOT become a blockquote"
);
assertEqual(
  renderMarkdown("```\nx = 1\n```"),
  "<pre><code>x = 1</code></pre>",
  "a fence is a code block"
);
assertEqual(
  renderMarkdown("line one\nline two"),
  "<p>line one<br>line two</p>",
  "a single newline becomes <br> inside a paragraph (§13.12)"
);
assertEqual(
  renderMarkdown("para one\n\npara two"),
  "<p>para one</p>\n<p>para two</p>",
  "a blank line separates paragraphs"
);
assertEqual(
  renderMarkdown("text\n# Heading"),
  "<p>text</p>\n<h1>Heading</h1>",
  "a heading ends the paragraph above it without a blank line"
);
{
  const html = renderMarkdown("[ENGIE](https://engie.be)");
  assertTrue(html.includes('href="https://engie.be"'), "an explicit link becomes an anchor");
  assertTrue(html.includes('rel="noopener noreferrer"'), "links carry rel=noopener noreferrer");
  assertTrue(html.includes('target="_blank"'), "links open in a new tab");
  assertTrue(html.includes(">ENGIE<"), "the label is used as the link text");
}
{
  const html = renderMarkdown("See https://example.com/x for details");
  assertTrue(html.includes('href="https://example.com/x"'), "a bare URL is autolinked");
  assertTrue(html.includes("See "), "the surrounding text survives autolinking");
}
assertEqual(
  (renderMarkdown("[a](https://example.com)").match(/<a /g) || []).length,
  1,
  "an explicit link is not autolinked a second time inside its own href"
);
assertTrue(
  renderMarkdown("Visit https://example.com.").includes('href="https://example.com"'),
  "a trailing sentence full stop is left out of the URL"
);
assertEqual(
  renderMarkdown("Code van de kluis: `4821`"),
  "<p>Code van de kluis: <code>4821</code></p>",
  "a realistic line from the legacy data renders correctly"
);
assertEqual(renderMarkdown("```\nunclosed"), "<pre><code>unclosed</code></pre>",
  "an unclosed fence does not run off the end");

group("markdown.js · markdownToPlain");

assertEqual(markdownToPlain(""), "", "empty gives empty");
assertEqual(markdownToPlain(null), "", "null gives empty");
assertEqual(markdownToPlain("# Title"), "Title", "strips heading markers");
assertEqual(markdownToPlain("**bold** and *italic*"), "bold and italic", "strips emphasis markers");
assertEqual(markdownToPlain("- one\n- two"), "one two", "flattens a list onto one line");
assertEqual(markdownToPlain("[ENGIE](https://engie.be)"), "ENGIE", "keeps the link label, drops the URL");
assertEqual(markdownToPlain("`code`"), "code", "strips code markers");
assertEqual(markdownToPlain("a\n\n\nb"), "a b", "collapses blank lines");
assertEqual(markdownToPlain("> quoted"), "quoted", "strips the quote marker");
{
  const long = markdownToPlain("x".repeat(300), 50);
  assertEqual(long.length, 50, "respects the length limit");
  assertTrue(long.endsWith("…"), "…and marks the truncation");
}
assertEqual(markdownToPlain("short", 50), "short", "text under the limit is untouched");
assertTrue(
  !markdownToPlain("```\nsecret\n```").includes("secret"),
  "a fenced block is dropped from the preview rather than dumped raw"
);

// ═══════════════════════════════════════════════════════════════════════════
// merge.js — the pure conflict resolution the whole of sync rests on (§7, §12)
// ═══════════════════════════════════════════════════════════════════════════

/** A record at a given time, alive or tombstoned. */
const rec = (id, updatedAt, over = {}) =>
  fx({ id, updatedAt, createdAt: "2026-01-01T00:00:00.000Z", ...over });
const dead = (id, updatedAt, deletedAt = updatedAt, over = {}) =>
  rec(id, updatedAt, { deletedAt, ...over });

group("merge.js · resolveRecord — tombstones");

{
  const live = rec("x", "2026-08-04T12:00:00.000Z", { title: "Nieuw" });
  const tomb = dead("x", "2026-01-01T00:00:00.000Z");
  assertEqual(
    resolveRecord(live, tomb).deletedAt !== null,
    true,
    "a tombstone beats a live record even when the live one is MUCH newer"
  );
  assertEqual(
    resolveRecord(tomb, live).deletedAt !== null,
    true,
    "…and in the other argument order too"
  );
  assertEqual(resolveRecord(live, tomb), tomb, "the tombstone object itself is returned");
}
{
  const older = dead("x", "2026-01-01T00:00:00.000Z");
  const newer = dead("x", "2026-06-01T00:00:00.000Z");
  assertEqual(resolveRecord(older, newer), newer, "between two tombstones the newer wins");
  assertEqual(resolveRecord(newer, older), newer, "…whichever way round they are passed");
}
{
  const a = rec("x", "2026-01-01T00:00:00.000Z");
  const b = rec("x", "2026-06-01T00:00:00.000Z");
  assertEqual(resolveRecord(a, b), b, "between two live records the newer wins");
  assertEqual(resolveRecord(b, a), b, "…whichever way round");
}

group("merge.js · mergeItemSets — incremental");

{
  const local = [
    rec("keep", "2026-01-01T00:00:00.000Z"),
    rec("mine-newer", "2026-06-01T00:00:00.000Z", { title: "lokaal nieuw" }),
    rec("theirs-newer", "2026-01-01T00:00:00.000Z", { title: "lokaal oud" }),
  ];
  const remote = [
    rec("mine-newer", "2026-01-01T00:00:00.000Z", { title: "extern oud" }),
    rec("theirs-newer", "2026-06-01T00:00:00.000Z", { title: "extern nieuw" }),
    rec("new-to-us", "2026-05-01T00:00:00.000Z"),
  ];
  const { merged, stats } = mergeItemSets(local, remote);
  const byId = Object.fromEntries(merged.map((r) => [r.id, r]));

  assertEqual(merged.length, 4, "the union of both sets survives");
  assertEqual(byId["keep"].title, "", "a record the remote has never seen is untouched");
  assertEqual(byId["mine-newer"].title, "lokaal nieuw", "our newer edit wins");
  assertEqual(byId["theirs-newer"].title, "extern nieuw", "their newer edit wins");
  assertTrue(!!byId["new-to-us"], "a record only they have arrives");
  assertEqual(stats.added, 1, "one added");
  assertEqual(stats.updated, 1, "one updated (only the record we actually changed)");
  assertEqual(stats.deleted, 0, "nothing deleted");
}
{
  // A delete made elsewhere reaches us.
  const local = [rec("x", "2026-06-01T00:00:00.000Z", { title: "nog hier" })];
  const remote = [dead("x", "2026-01-01T00:00:00.000Z")];
  const { merged, stats } = mergeItemSets(local, remote);
  assertTrue(!!merged[0].deletedAt, "the tombstone wins over our newer live copy");
  assertEqual(stats.deleted, 1, "…and is reported as a deletion");
  assertEqual(stats.updated, 0, "a deletion is not double-counted as an update");
}
{
  // A tombstone for something we never had is not a user-visible deletion.
  const { stats } = mergeItemSets([], [dead("gone", "2026-01-01T00:00:00.000Z")]);
  assertDeepEqual(stats, { added: 0, updated: 0, deleted: 0 },
    "a tombstone for a record we never had counts as nothing");
}
{
  // Idempotence: merging the same sets twice changes nothing the second time.
  const local = [rec("a", "2026-01-01T00:00:00.000Z"), dead("b", "2026-02-01T00:00:00.000Z")];
  const remote = [rec("a", "2026-03-01T00:00:00.000Z"), rec("c", "2026-01-01T00:00:00.000Z")];
  const first = mergeItemSets(local, remote);
  const second = mergeItemSets(first.merged, remote);
  assertDeepEqual(second.stats, { added: 0, updated: 0, deleted: 0 },
    "re-merging an already-merged set is a no-op — sync must converge, not oscillate");
  assertEqual(second.merged.length, first.merged.length, "…and produces the same set");

group("merge.js · mergeItemSets — resurrection prevention (§13.6)");

{
  // The scenario the whole tombstone design exists for: a stale device that
  // never saw the delete comes back online carrying its old live copy.
  const drive = [dead("x", "2026-05-01T00:00:00.000Z")];
  const staleDevice = [rec("x", "2026-04-01T00:00:00.000Z", { title: "oude kopie" })];

  const atStaleDevice = mergeItemSets(staleDevice, drive);
  assertTrue(!!atStaleDevice.merged[0].deletedAt, "the stale device learns of the delete");

  // …and its push back to Drive must not undo it.
  const backAtDrive = mergeItemSets(drive, atStaleDevice.merged);
  assertTrue(!!backAtDrive.merged[0].deletedAt, "pushing back does NOT resurrect the record");
  assertDeepEqual(backAtDrive.stats, { added: 0, updated: 0, deleted: 0 },
    "…and Drive sees no change at all");
}
{
  // A restored record carries a NEW id, so the old tombstone cannot kill it.
  const tomb = dead("old", "2026-05-01T00:00:00.000Z");
  const { revived, tombstone } = planRestore(tomb, "brand-new", {}, "2026-06-01T00:00:00.000Z");
  const { merged } = mergeItemSets([tombstone, revived], [tomb]);
  const byId = Object.fromEntries(merged.map((r) => [r.id, r]));
  assertEqual(byId["brand-new"].deletedAt, null, "the revived copy survives a sync with the old tombstone");
  assertTrue(!!byId["old"].deletedAt, "…and the original tombstone is still a tombstone");
}

assertEqual(isEmptyMerge({ added: 1, updated: 0, deleted: 0 }), false, "one addition is not empty");

  assertDeepEqual(actions.toDownload, ["there-only"], "a referenced blob only Drive holds is downloaded");
  assertDeepEqual(actions.toDeleteLocal, ["local-orphan"], "an unreferenced local blob is collected");

  // §13.7, the silent storage leak: the device that deleted the record has

group("merge.js · planBackupPruning (rolling backups, §6)");

// The names carry an ISO timestamp with the separators swapped, so sorting them
// as STRINGS is the same as sorting them by time — and unlike Drive's
// modifiedTime it cannot be moved by anything touching the file later.
const backup = (iso) => ({ id: `id-${iso}`, name: `backup-${iso}.json` });
const stamps = [
  "2026-01-01T00-00-00-000Z", "2026-02-01T00-00-00-000Z", "2026-03-01T00-00-00-000Z",
  "2026-04-01T00-00-00-000Z", "2026-05-01T00-00-00-000Z", "2026-06-01T00-00-00-000Z",
  "2026-07-01T00-00-00-000Z", "2026-08-01T00-00-00-000Z", "2026-09-01T00-00-00-000Z",
  "2026-10-01T00-00-00-000Z", "2026-11-01T00-00-00-000Z", "2026-12-01T00-00-00-000Z",
];

assertDeepEqual(planBackupPruning([], 10), [], "nothing to prune in an empty folder");
assertDeepEqual(planBackupPruning(null, 10), [], "a missing listing is survivable, not a crash");
assertDeepEqual(
  planBackupPruning(stamps.slice(0, 10).map(backup), 10),
  [],
  "exactly at the limit, nothing is deleted"
);

{
  const doomed = planBackupPruning(stamps.map(backup), 10);
  assertEqual(doomed.length, 2, "12 backups with a limit of 10 leaves 2 doomed");
  assertDeepEqual(
    doomed.map((f) => f.name),
    ["backup-2026-01-01T00-00-00-000Z.json", "backup-2026-02-01T00-00-00-000Z.json"],
    "the OLDEST two go, and they go oldest-first"
  );
}

{
  // Order in the listing is Drive's business, not ours.
  const shuffled = [stamps[5], stamps[0], stamps[11], stamps[3]].map(backup);
  const doomed = planBackupPruning(shuffled, 2);
  assertDeepEqual(
    doomed.map((f) => f.name),
    ["backup-2026-01-01T00-00-00-000Z.json", "backup-2026-04-01T00-00-00-000Z.json"],
    "an unsorted listing still yields the two oldest"
  );
}

{
  // The backup folder is a user-visible Drive folder; anything else in it —
  // including the live sync files — must be untouchable.
  const mixed = [
    { id: "a", name: "items.json" },
    { id: "b", name: "media-manifest.json" },
    { id: "c", name: "holiday-photo.jpg" },
    { id: "d", name: "notes about backup-2026.json" },
    ...stamps.slice(0, 3).map(backup),
  ];
  const doomed = planBackupPruning(mixed, 1);
  assertEqual(doomed.length, 2, "only real backups are counted");
  assertTrue(
    doomed.every((f) => /^backup-/.test(f.name)),

  );
}

group("sync.js · parseItems refuses what it cannot read");

// This guard exists for one scenario. Encrypting items.json is coming; a device
// still on an older build would parse the envelope as "no records", merge that
// as an empty remote, and then upload its own plaintext set straight over the
// encrypted file. Every account number republished in the clear, reported as a
// successful sync. So: unrecognised means ABORT, never "assume empty".

assertDeepEqual(parseItems('[]'), [], "a bare empty array reads as no records");
assertDeepEqual(parseItems('[{"id":"a"}]'), [{ id: "a" }], "the v1 bare-array payload still reads");
assertDeepEqual(parseItems('{"items":[{"id":"a"}]}'), [{ id: "a" }],
  "the enveloped form reads too — this is the hook the encrypted payload will hang on");
assertDeepEqual(parseItems(""), [], "a zero-byte file is the one benign empty case");
assertDeepEqual(parseItems("   \n "), [], "…whitespace too");
assertDeepEqual(parseItems(null), [], "…and a missing body");

function refuses(text, expectedCode, message) {
  let thrown = null;
  try {
    parseItems(text);
  } catch (err) {
    thrown = err;
  }
  assertTrue(thrown instanceof SyncError, `${message} — throws a SyncError`);
  assertEqual(thrown && thrown.code, expectedCode, `${message} — code is "${expectedCode}"`);
}

refuses('{"v":2,"enc":"AES-GCM","iv":"…","ct":"…"}', "unsupported-format",
  "an ENCRYPTED payload from a newer build is refused, not treated as empty");
refuses('{"version":3,"records":[]}', "unsupported-format",
  "any future payload shape is refused");
refuses('{"something":"else"}', "unsupported-format", "an object with no items array is refused");
refuses("not json at all", "unreadable", "a corrupt file is refused");
refuses('{"items":', "unreadable", "a truncated file is refused");
refuses('"a string"', "unreadable", "a bare JSON string is refused");
refuses("42", "unreadable", "a bare number is refused");

{
  let thrown = null;
  try {
    parseItems('{"v":2,"enc":"AES-GCM"}');
  } catch (err) {
    thrown = err;
  }
  assertTrue(String(thrown.detail).includes("v2"),
    "the refusal names the payload version, so the sync log says 'upgrade this device' rather than 'something went wrong'");
}
{
  // items wins over a version marker: an enveloped v1 payload is still readable.
  assertDeepEqual(parseItems('{"v":1,"items":[{"id":"x"}]}'), [{ id: "x" }],
    "a version marker alongside a readable items array does not block the read");
}

    const next = lines[i + 1] || "";

    fx({ id: "a", tags: ["water"], updatedAt: "2026-01-01T00:00:00.000Z" }),
    fx({ id: "b", tags: ["alarm"], updatedAt: "2026-05-01T00:00:00.000Z" }),
    fx({ id: "c", tags: ["water", "alarm"], updatedAt: "2026-03-01T00:00:00.000Z" }),
    fx({ id: "d", tags: ["oud"], updatedAt: "2026-09-01T00:00:00.000Z", deletedAt: "2026-09-02T00:00:00.000Z" }),
  ]);
  assertDeepEqual(tags.map((t) => t.tag), ["alarm", "water"], "most recently used tag first");
  assertEqual(tags[0].count, 2, "counts how many records carry the tag");
  assertEqual(tags[0].lastUsedAt, "2026-05-01T00:00:00.000Z", "reports the most recent use");
  assertTrue(!tags.some((t) => t.tag === "oud"), "tags only used by tombstones are excluded");
}
{
  const tags = sortTagsByRecency([fx({ tags: ["Water"] }), fx({ tags: ["water"] })]);
  assertEqual(tags.length, 1, "tags differing only in case are one tag");
  assertEqual(tags[0].count, 2, "…and their counts are combined");
}
assertDeepEqual(sortTagsByRecency([]), [], "no items means no tags");
assertDeepEqual(sortTagsByRecency([fx({ tags: ["", "  "] })]), [], "blank tags are ignored");

group("db.js · reminderTypesInUse (the §14 combobox)");

{
  const types = reminderTypesInUse([
    fx({ id: "a", reminderType: "Onderhoud", updatedAt: "2026-01-01T00:00:00.000Z" }),
    fx({ id: "b", reminderType: "Onderhoud", updatedAt: "2026-02-01T00:00:00.000Z" }),
    fx({ id: "c", reminderType: "Keuring", updatedAt: "2026-06-01T00:00:00.000Z" }),
    fx({ id: "d", reminderType: "", updatedAt: "2026-07-01T00:00:00.000Z" }),
    fx({ id: "e", reminderType: "Weg", deletedAt: "2026-07-02T00:00:00.000Z" }),
  ]);
  assertDeepEqual(types.map((x) => x.value), ["Onderhoud", "Keuring"], "most-used suggestion first");
  assertEqual(types[0].count, 2, "counts uses");
  assertTrue(!types.some((x) => x.value === "Weg"), "values only on tombstones are excluded");
  assertTrue(!types.some((x) => x.value === ""), "an empty reminder type is not a suggestion");
}
{
  const types = reminderTypesInUse([fx({ reminderType: "onderhoud" }), fx({ reminderType: "Onderhoud" })]);
  assertEqual(types.length, 1, "values differing only in case are one suggestion");
}
assertDeepEqual(reminderTypesInUse([]), [], "no items means no suggestions");

group("db.js · backlinks");

{
  const items = [
    fx({ id: "a", linkedIds: ["b", "c"] }),
    fx({ id: "b", linkedIds: [] }),
    fx({ id: "c", linkedIds: ["b"] }),
    fx({ id: "d", linkedIds: ["b"], deletedAt: "2026-01-02T00:00:00.000Z" }),
  ];
  assertDeepEqual(ids(computeBacklinks(items, "b")).sort(), ["a", "c"], "finds records pointing at an id");
  assertDeepEqual(ids(computeBacklinks(items, "a")), [], "an id nothing points at has no backlinks");
  assertTrue(!ids(computeBacklinks(items, "b")).includes("d"), "a tombstone is not a backlink");
  assertDeepEqual(computeBacklinks(items, ""), [], "an empty id has no backlinks");
  assertDeepEqual([...computeLinkedIdSet(items)].sort(), ["b", "c"], "collects every referenced id once");
  assertEqual(computeLinkedIdSet([]).size, 0, "no items means no linked ids");
}

group("db.js · appendActivity (§8.4 ring buffer)");

{
  const one = appendActivity([], { kind: "sync", outcome: "success", detail: "ok" });
  assertEqual(one.length, 1, "appends to an empty log");
  assertEqual(one[0].kind, "sync", "keeps the kind");
  assertTrue(!Number.isNaN(Date.parse(one[0].at)), "stamps a parseable timestamp");

  const two = appendActivity(one, { kind: "backup", outcome: "error", detail: "boom" });
  assertEqual(two[0].kind, "backup", "newest entry is first");
  assertEqual(two[1].kind, "sync", "the older entry moves down");
  assertEqual(one.length, 1, "the input log is not mutated");
}
{
  let log = [];
  for (let i = 0; i < ACTIVITY_CAP + 25; i++) log = appendActivity(log, { detail: `entry ${i}` });
  assertEqual(log.length, ACTIVITY_CAP, "the log is capped");
  assertEqual(log[0].detail, `entry ${ACTIVITY_CAP + 24}`, "the newest entry survives the cap");
  assertTrue(!log.some((e) => e.detail === "entry 0"), "the oldest entries are dropped");
}
assertEqual(
  appendActivity([], { detail: "x".repeat(500) })[0].detail.length,
  ACTIVITY_DETAIL_MAX,
  "detail is truncated so one bad error cannot fill the store"
);
assertEqual(appendActivity(null, { detail: "x" }).length, 1, "a missing log is treated as empty");
assertEqual(appendActivity([], {}, 0).length, 1, "a cap of zero still keeps the newest entry");

// ═══════════════════════════════════════════════════════════════════════════
// db.js — IndexedDB. Runs against a SEPARATE database; real data is never
// touched. §12 says DOM behaviour is verified by driving the app, but storage
// round-trips are cheap to assert here and catch transaction mistakes early.
// ═══════════════════════════════════════════════════════════════════════════
const TEST_DB = "huisbeheer-tests";
useDatabase(TEST_DB);

group("db.js · IndexedDB — items");

await openDB();
await clearItems();

{
  const saved = await putItem(makeRecord({ id: "r1", title: "Alarm", type: "configuration" }));
  const read = await getItem("r1");
  assertEqual(read.title, "Alarm", "a written record reads back");
  assertEqual(read.type, "configuration", "the type round-trips");
  assertTrue(read.updatedAt >= saved.createdAt, "updatedAt is stamped on write");
  assertEqual(await getItem("nope"), null, "an unknown id reads back null");
  assertEqual(await getItem(""), null, "an empty id reads back null");
}
{
  const original = makeRecord({ id: "r2", title: "Oud", updatedAt: "2020-01-01T00:00:00.000Z" });
  const touched = await putItem(original);
  assertTrue(touched.updatedAt > "2020-01-01T00:00:00.000Z", "putItem bumps updatedAt by default");

  await putItem(makeRecord({ id: "r3", title: "Sync", updatedAt: "2020-01-01T00:00:00.000Z" }), { touch: false });
  const kept = await getItem("r3");
  assertEqual(kept.updatedAt, "2020-01-01T00:00:00.000Z",
    "touch:false preserves updatedAt — the sync/import path depends on it");
}
await assertRejects(putItem({ title: "no id" }), "putItem rejects a record with no id");

{
  const n = await putItems([
    makeRecord({ id: "b1", title: "Een", updatedAt: "2021-01-01T00:00:00.000Z" }),
    makeRecord({ id: "b2", title: "Twee", updatedAt: "2021-01-01T00:00:00.000Z" }),
  ]);
  assertEqual(n, 2, "putItems reports how many it wrote");
  assertEqual((await getItem("b1")).updatedAt, "2021-01-01T00:00:00.000Z",
    "putItems never touches updatedAt (bulk = sync/restore)");
  assertEqual(await putItems([{ title: "no id" }]), 0, "putItems skips records with no id");
  assertEqual(await putItems(null), 0, "putItems tolerates a null input");
}

{
  const all = await getAllItems();
  assertEqual(all.length, 5, "getAllItems returns everything written so far");
  assertTrue(all.every((i) => "reminderType" in i), "records come back hydrated");
}

{
  const page = await queryItems({ limit: 2 });
  assertEqual(page.results.length, 2, "queryItems paginates through the store");
  assertEqual(page.total, 5, "queryItems totals the whole store");
  assertEqual((await queryItems({ search: "alarm" })).total, 1, "queryItems searches the store");
}

group("db.js · IndexedDB — soft delete and trash");

{
  await softDeleteItem("r1");
  const gone = await getItem("r1");
  assertTrue(!!gone, "a soft-deleted record still EXISTS — a hard delete cannot propagate");
  assertTrue(!!gone.deletedAt, "…and now carries a tombstone timestamp");
  assertEqual((await queryItems({})).total, 4, "the tombstone drops out of normal queries");

  const trash = await getDeletedItems();
  assertDeepEqual(trash.map((i) => i.id), ["r1"], "the tombstone appears in the trash");
  assertEqual(await softDeleteItem("r1"), null, "deleting an already-deleted record is a no-op");
  assertEqual(await softDeleteItem("nope"), null, "deleting an unknown id is a no-op");

  await putItem({ ...gone, id: "r1", restoredAt: "2026-01-01T00:00:00.000Z" }, { touch: false });
  assertEqual((await getDeletedItems()).length, 0, "a restored tombstone leaves the trash");
}

group("db.js · IndexedDB — meta");

{
  assertEqual(await getMeta("nothing", "fallback"), "fallback", "an unset key returns the fallback");
  assertEqual(await getMeta("nothing"), null, "an unset key with no fallback returns null");
  assertEqual(
    await getMeta("nothing", undefined),
    null,
    "passing undefined as the fallback selects the DEFAULT null — so callers " +
      "must use a sentinel to detect a missing key, never `=== undefined`"
  );
  {
    const sentinel = Symbol("missing");
    assertEqual(await getMeta("nothing", sentinel), sentinel, "a sentinel fallback passes through");
    await setMeta("present", false);
    assertEqual(await getMeta("present", sentinel), false,
      "a stored `false` is distinguishable from a missing key via the sentinel");
    await deleteMeta("present");
  }
  await setMeta("theme", "paper");
  assertEqual(await getMeta("theme"), "paper", "a string round-trips");
  await setMeta("obj", { a: 1, b: [2, 3] });
  assertDeepEqual(await getMeta("obj"), { a: 1, b: [2, 3] }, "a structured value round-trips");
  await setMeta("falsy", false);
  assertEqual(await getMeta("falsy", "fallback"), false,
    "a stored `false` is returned, NOT replaced by the fallback");
  await setMeta("zero", 0);
  assertEqual(await getMeta("zero", 99), 0, "a stored 0 is returned, not replaced by the fallback");
  await deleteMeta("theme");
  assertEqual(await getMeta("theme", "gone"), "gone", "a deleted key falls back again");
}

group("db.js · IndexedDB — sync log");

{
  await clearActivityLog();
  assertDeepEqual(await getActivityLog(), [], "the log starts empty");
  await logActivity("sync", "success", "1 record");
  await logActivity("autosync", "skipped", "offline");
  const log = await getActivityLog();
  assertEqual(log.length, 2, "entries accumulate");
  assertEqual(log[0].kind, "autosync", "newest first");
  assertEqual(log[0].outcome, "skipped", "a skip reason is recorded, or sync looks broken");
  await clearActivityLog();
  assertDeepEqual(await getActivityLog(), [], "the log clears");
}

group("db.js · IndexedDB — the v2 upgrade");

{
  // Everything above this line already proved the three original stores work.
  // This proves the version bump actually created the fourth one, rather than
  // silently leaving it out and failing on the first write next phase.
  const db = await openDB();
  assertTrue(db.objectStoreNames.contains(STORE_VERSIONS),
    "the versions store exists after the v2 upgrade");
  assertTrue(db.objectStoreNames.contains("items"), "…and items survived the upgrade");
  assertTrue(db.objectStoreNames.contains("media"), "…and media");
  assertTrue(db.objectStoreNames.contains("meta"), "…and meta");
  assertEqual(db.version, 2, "the database is at version 2");
}
{
  // An event is a record as far as storage is concerned. If that ever stops
  // being true, everything the timeline inherits for free stops working.
  const event = makeRecord({
    kind: "event", eventType: "incident", type: "devices",
    title: "Stroomstoring", occurredAt: "2026-04-01", amount: 89.5, linkedIds: ["router-id"],
  });
  await putItem(event);
  const back = await getItem(event.id);
  assertEqual(back.kind, "event", "an event round-trips through the items store");
  assertEqual(back.eventType, "incident", "…with its event type");
  assertEqual(back.occurredAt, "2026-04-01", "…its date");
  assertEqual(back.amount, 89.5, "…and its amount");
  assertDeepEqual(back.linkedIds, ["router-id"], "…still pointing at its subject");

  const found = await queryItems({ kind: "event" });
  assertTrue(found.results.some((r) => r.id === event.id), "and the async query finds it by kind");
}

group("db.js · IndexedDB — media");

{
  const blob = new Blob(["hello"], { type: "text/plain" });
  const thumb = new Blob(["t"], { type: "text/plain" });
  await putMedia({ id: "m1", blob, thumbnailBlob: thumb });

  const read = await getMedia("m1");
  assertTrue(!!read, "media reads back");
  assertEqual(await read.blob.text(), "hello", "the blob content survives the round-trip");
  assertEqual(await read.thumbnailBlob.text(), "t", "the thumbnail survives too");
  assertEqual(await getMedia("nope"), null, "unknown media reads back null");

  const cloneId = await cloneMedia("m1");
  assertTrue(!!cloneId && cloneId !== "m1", "cloneMedia returns a NEW id");
  assertEqual(await (await getMedia(cloneId)).blob.text(), "hello", "the clone holds the same bytes");
  assertEqual(await cloneMedia("nope"), null, "cloning unknown media returns null");

  const keys = await getAllMediaIds();
  assertTrue(keys.includes("m1") && keys.includes(cloneId), "getAllMediaIds lists both");

  await deleteMedia("m1");
  assertEqual(await getMedia("m1"), null, "deleted media is gone");
  assertTrue(!!(await getMedia(cloneId)), "…and the clone is untouched, not sharing storage");
  await deleteMedia(cloneId);
}

group("db.js · IndexedDB — stats and storage");

{
  await clearItems();
  await putItems([
    makeRecord({ id: "s1", type: "devices", reminderAt: "2026-08-01" }),
    makeRecord({ id: "s2", type: "configuration" }),
  ]);
  const s = await getStats("2026-08-04");
  assertEqual(s.total, 2, "getStats reads the live store");
  assertEqual(s.byType.devices, 1, "…and breaks down by type");
  assertEqual(s.overdue, 1, "…and honours the `today` it is given");

  const estimate = await getStorageEstimate();
  assertTrue(estimate === null || typeof estimate.usage === "number",
    "getStorageEstimate returns a shape or null, never throws");
}

// Leave nothing behind.
await clearItems();
await closeDB();
await new Promise((resolve) => {
  const request = indexedDB.deleteDatabase(TEST_DB);
  request.onsuccess = request.onerror = request.onblocked = () => resolve();
});
record(true, "the test database is deleted afterwards");

// ═══════════════════════════════════════════════════════════════════════════
// i18n.js
// ═══════════════════════════════════════════════════════════════════════════
group("i18n.js · t()");

const langBefore = state.lang;

setLang("nl");
assertEqual(t("action.save"), "Opslaan", "nl lookup");
setLang("en");
assertEqual(t("action.save"), "Save", "en lookup");
assertEqual(t("list.count", { count: 3, total: 18 }), "3 of 18", "interpolates named vars");
assertEqual(t("list.count", { count: 0, total: 0 }), "0 of 0", "interpolates zero (not treated as absent)");
assertEqual(t("list.count", {}), "{count} of {total}", "leaves unknown placeholders in place");
assertEqual(t("list.count"), "{count} of {total}", "no vars leaves the raw template");
assertEqual(t("no.such.key"), "no.such.key", "an unknown key returns the key itself");
assertEqual(typeLabel("devices"), "Devices", "typeLabel translates a type");
setLang("nl");
assertEqual(typeLabel("devices"), "Apparaten", "typeLabel follows the language");

group("i18n.js · dictionary parity");

{
  const { nl, en } = _dictKeys();
  const missingEn = nl.filter((k) => !en.includes(k));
  const missingNl = en.filter((k) => !nl.includes(k));
  assertDeepEqual(missingEn, [], "every nl key exists in en");
  assertDeepEqual(missingNl, [], "every en key exists in nl");
  assertEqual(new Set(nl).size, nl.length, "no duplicate nl keys");
  assertTrue(nl.length > 0, "the dictionary is not empty");
}
{
  const missing = [];
  for (const lang of ["nl", "en"]) {
    setLang(lang);
    for (const type of TYPES) {
      if (t(`type.${type}`) === `type.${type}`) missing.push(`${lang}:${type}`);
    }
  }
  assertDeepEqual(missing, [], "every record type has a label in both languages");
}
{
  const missing = [];
  for (const lang of ["nl", "en"]) {
    setLang(lang);
    for (const eventType of EVENT_TYPES) {
      if (eventTypeLabel(eventType) === `eventType.${eventType}`) missing.push(`${lang}:${eventType}`);
    }
    for (const kind of KINDS) {
      if (kindLabel(kind) === `kind.${kind}`) missing.push(`${lang}:${kind}`);
    }
  }
  assertDeepEqual(missing, [], "every event type and kind has a label in both languages");
  setLang("nl");
  assertEqual(eventTypeLabel("incident"), "Storing", "the Dutch label is the household word, not a calque");
  setLang("en");
  assertEqual(eventTypeLabel("incident"), "Incident", "…and the English one reads plainly");
}

setLang(langBefore);

// ═══════════════════════════════════════════════════════════════════════════
// icons.js
// ═══════════════════════════════════════════════════════════════════════════
group("icons.js");

assertTrue(ICON_NAMES.length > 0, "the glyph set is not empty");
{
  const broken = ICON_NAMES.filter((n) => !icon(n).startsWith("<svg"));
  assertDeepEqual(broken, [], "every glyph renders an <svg> root");
}
{
  const empty = ICON_NAMES.filter((n) => !/<(path|circle|rect|ellipse)/.test(icon(n)));
